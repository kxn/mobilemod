name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0-dev
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 scripts/audit_public.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Scan all Git history for secrets and personal identifiers
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all
      - name: Known reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tools)"
      - run: go test ./... -count=1 -coverprofile coverage.out
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/bot -run '^$' -fuzz FuzzParse -fuzztime 10s -parallel 2
      - if: matrix.os == 'ubuntu-24.04'
        run: go test ./internal/config -run '^$' -fuzz FuzzValidNumber -fuzztime 10s -parallel 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
  package:
    needs: [audit, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build five 64-bit platform packages from the public allowlist
        run: go run ./tools/release -version "$RELEASE_VERSION" -output packages
      - name: Verify checksums and execute x86-64 Linux package
        run: |
          (cd packages && sha256sum --check SHA256SUMS)
          for arch in amd64; do
            tar -xzf "packages/mobilemod-$RELEASE_VERSION-linux-$arch.tar.gz" -C "$RUNNER_TEMP"
            binary="$RUNNER_TEMP/mobilemod-$RELEASE_VERSION-linux-$arch/mobilemod"
            test "$("$binary" version)" = "$RELEASE_VERSION"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          if-no-files-found: error
