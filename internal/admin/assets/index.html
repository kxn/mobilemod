<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短信网关 · 管理</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">MOBILEMOD</div><h1>短信网关</h1><p>查看连接状态，管理 SIM 与飞书设置。</p></div><div class="refresh"><span id="updated">正在连接…</span><button id="refresh" type="button">刷新状态</button></div></header>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="gateway">
    <section class="overview" aria-label="网关概况">
      <div class="metric"><span>飞书事件连接</span><strong id="feishu">—</strong></div>
      <div class="metric"><span>在线模块</span><strong id="online">—</strong></div>
      <div class="metric"><span>待转发消息</span><strong id="pending">—</strong></div>
      <div class="metric"><span>发送失败</span><strong id="failed">—</strong></div>
    </section>
    <p id="delivery-warning" class="delivery-warning" role="alert" hidden></p>
    <section class="section-head"><div><h2>模块与 SIM</h2><p>自动读取优先；手工号码只属于当前 SIM，换卡后不会沿用。</p></div><span class="hint">国内手机号可不填 +86</span></section>
    <section id="modules" class="modules" aria-label="模块列表"><p class="loading">正在读取模块状态…</p></section>
    <section class="section-head"><div><h2>网关设置</h2><p>配置保存到本机数据库，重启后继续生效。</p></div></section>
    <section class="modules" aria-label="网关设置">
      <article class="settings"><h3>飞书认证</h3><p>验证成功后重新建立长连接，不发送测试消息。更换应用后，给机器人发一条单聊消息即可自动更新接收人；群命令白名单仍需按需维护。</p>
        <form id="feishu-form">
          <label for="feishu-app-id">App ID</label><input id="feishu-app-id" autocomplete="off" maxlength="128" required>
          <label for="feishu-secret">App Secret</label><input id="feishu-secret" type="password" autocomplete="new-password" maxlength="256" placeholder="留空保留当前应用的密钥">
          <p class="small" id="feishu-secret-state"></p><button class="save" type="submit">验证并保存</button><div class="message" id="feishu-message" role="status"></div>
        </form>
      </article>
    </section>
    </div>
  </main>
</body>
</html>
