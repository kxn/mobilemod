<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短信网关 · 管理</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">MOBILEMOD</div><h1>短信网关</h1><p>查看连接状态，管理每张 SIM 的接收号码。</p></div><div class="refresh"><span id="updated">正在连接…</span><button id="refresh" type="button">刷新状态</button></div></header>
    <section class="overview" aria-label="网关概况">
      <div class="metric"><span>飞书长连接</span><strong id="feishu">—</strong></div>
      <div class="metric"><span>在线模块</span><strong id="online">—</strong></div>
      <div class="metric"><span>待转发消息</span><strong id="pending">—</strong></div>
    </section>
    <div id="notice" role="status" aria-live="polite"></div>
    <section class="section-head"><div><h2>模块与 SIM</h2><p>自动读取优先；手工号码只属于当前 SIM，换卡后不会沿用。</p></div><span class="hint">国内手机号可不填 +86</span></section>
    <section id="modules" class="modules" aria-label="模块列表"><p class="loading">正在读取模块状态…</p></section>
    <footer>仅在本机开放 · 不自动接听电话 · 短信提交成功不代表手机送达</footer>
  </main>
</body>
</html>
